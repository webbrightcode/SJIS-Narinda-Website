<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00225A"/>
      <stop offset="100%" stop-color="#001433"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Emblem Group -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Outer Shield Border -->
    <path d="M50 0 C78 0, 95 15, 95 45 C95 75, 50 98, 50 100 C50 98, 5 75, 5 45 C5 15, 22 0, 50 0 Z" 
          fill="url(#goldGrad)" stroke="#FFE899" stroke-width="1.5"/>
    <!-- Inner Shield Body -->
    <path d="M50 4 C75 4, 91 17, 91 45 C91 72, 50 94, 50 96 C50 94, 9 72, 9 45 C9 17, 25 4, 50 4 Z" 
          fill="url(#shieldGrad)"/>

    <!-- Holy Cross Symbol -->
    <path d="M47 16 H53 V30 H67 V36 H53 V68 H47 V36 H33 V30 H47 Z" fill="url(#goldGrad)"/>

    <!-- Open Book of Knowledge -->
    <path d="M30 76 C38 72, 47 73, 50 77 C53 73, 62 72, 70 76 V88 C62 84, 53 85, 50 89 C47 85, 38 84, 30 88 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="77" x2="50" y2="89" stroke="url(#goldGrad)" stroke-width="2"/>

    <!-- Star of Excellence -->
    <polygon points="50,2 52,7 57,7 53,10 55,15 50,12 45,15 47,10 43,7 48,7" fill="#FFF8DB"/>
  </g>

  <!-- Typography Group -->
  <g transform="translate(125, 38)">
    <!-- Main School Name -->
    <text x="0" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
      ST. JOSEPH
    </text>
    <!-- Subtitle / Legacy -->
    <text x="0" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="13" font-weight="700" letter-spacing="2.5" fill="#D4AF37">
      INTERNATIONAL SCHOOL
    </text>
    <!-- Campus & Motto -->
    <text x="0" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="9.5" font-weight="600" letter-spacing="1.5" fill="#94A3B8">
      NARINDA, DHAKA • ESTD. 1954
    </text>
  </g>
</svg>
