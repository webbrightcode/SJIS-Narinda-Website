# ==============================================================================
# Nginx Configuration for SJIS Narinda (Host / Bare-Metal Deployment)
# Place at: /etc/nginx/sites-available/narinda.sjis.edu.bd
# Enable with: sudo ln -s /etc/nginx/sites-available/narinda.sjis.edu.bd /etc/nginx/sites-enabled/
# Test with: sudo nginx -t && sudo systemctl reload nginx
# ==============================================================================

upstream sjis_backend_native {
    server 127.0.0.1:8000;
}

upstream sjis_frontend_native {
    server 127.0.0.1:3000;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name narinda.sjis.edu.bd www.narinda.sjis.edu.bd;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name narinda.sjis.edu.bd www.narinda.sjis.edu.bd;

    # SSL Configuration (Certbot or custom certs)
    ssl_certificate /etc/letsencrypt/live/narinda.sjis.edu.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/narinda.sjis.edu.bd/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Max upload limit for school images, documents, and logos
    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Django Static Files
    location /static/ {
        alias /var/www/sjis/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Django Uploaded Media Files
    location /media/ {
        alias /var/www/sjis/backend/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Next.js Static Optimization Cache
    location /_next/static/ {
        proxy_pass http://sjis_frontend_native/_next/static/;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Django REST Framework API
    location /api/ {
        proxy_pass http://sjis_backend_native/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }

    # Django Admin Backend Console
    location /django-admin/ {
        proxy_pass http://sjis_backend_native/django-admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Next.js Frontend Application & Admin Center (/admin)
    location / {
        proxy_pass http://sjis_frontend_native;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}
